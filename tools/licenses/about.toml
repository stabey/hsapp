# cargo-about 0.9.2 configuration for the macOS desktop distribution.
# Crate-specific exceptions must remain after all global fields.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

# Build dependencies can contribute code to a shipped artifact; include them.
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
private = { ignore = true }

workarounds = [
    "chrono",
    "cocoa",
    "ring",
    "rustix",
    "rustls",
]

# MPL-2.0 is intentionally accepted only for these reviewed packages, not as a
# workspace-wide license policy.
[cbindgen]
accepted = ["MPL-2.0"]

[option-ext]
accepted = ["MPL-2.0"]

# The opted-in ring workaround identifies an additional OpenSSL license text.
[ring]
accepted = ["OpenSSL"]
