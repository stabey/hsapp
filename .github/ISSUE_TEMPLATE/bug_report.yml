name: Bug report
description: Report reproducible behavior that is incorrect or unexpected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not attach a real game log until every
        player name, BattleTag, GameAccountId, deck name, and local path has
        been replaced with synthetic data. Report vulnerabilities through the
        private Security Advisory link instead.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release version or commit hash that shows the problem.
      placeholder: v0.1.0 or 0123456
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version and Apple Silicon or Intel.
      placeholder: macOS 15.6, Apple Silicon
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that triggers the issue.
      placeholder: |
        1. Start Hearth Advisor...
        2. Open...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized screenshots, a minimal fixture, or other useful details.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all real player identifiers, account IDs, deck names, and local paths from every attachment.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
